services:
  db:
    image: postgres:16-alpine
    container_name: forensics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: forensics
      POSTGRES_PASSWORD: forensics
      POSTGRES_DB: forensics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensics"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: forensics_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://forensics:forensics@db:5432/forensics
      GIN_MODE: release
    ports:
      - "8080:8080"

volumes:
  pgdata: